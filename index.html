<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shelf</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#2a2233;--wall:#a9bdb6;--wood:#b57b4c;--back:#f4e5d3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--wall);font-family:'Gaegu','Comic Sans MS','Segoe Print',cursive;font-size:19px;color:var(--ink);display:grid;place-items:center;overflow-x:hidden}

#room{position:relative;display:grid;grid-template-columns:minmax(130px,210px) minmax(0,660px);gap:clamp(18px,4vw,56px);align-items:end;width:min(100%,980px);padding:24px 16px 210px}
.wincol{position:relative;z-index:12}
.win{position:relative;aspect-ratio:2/3.2;border:9px solid #f0e6d6;outline:3px solid var(--ink);border-radius:999px 999px 6px 6px;overflow:hidden;filter:url(#sq)}
.win::before,.win::after{content:"";position:absolute;z-index:3;background:#f0e6d6;box-shadow:0 0 0 2px var(--ink)}
.win::before{left:calc(50% - 4px);top:0;bottom:0;width:8px}
.win::after{top:55%;left:0;right:0;height:8px}
.sky,.stars,#rain{position:absolute;inset:0;width:100%;height:100%}
.stars{opacity:0;background:radial-gradient(1.5px 1.5px at 20% 18%,#fff,transparent),radial-gradient(1.5px 1.5px at 70% 12%,#fff,transparent),radial-gradient(2px 2px at 45% 30%,#fff,transparent),radial-gradient(1.5px 1.5px at 82% 38%,#fff,transparent),radial-gradient(1.5px 1.5px at 15% 44%,#fff,transparent)}
.sun{position:absolute;width:42px;height:42px;margin:-21px 0 0 -21px;border-radius:50%;background:#ffe27a;border:3px solid var(--ink);box-shadow:0 0 30px 12px rgba(255,226,122,.55)}
.sun.moon{background:#f4f0d8;box-shadow:0 0 22px 6px rgba(244,240,216,.35)}
.cloud{position:absolute;height:18px;width:62px;background:#fff;border:3px solid var(--ink);border-radius:20px;opacity:.92;animation:drift 70s linear infinite}
.c1{top:26%}.c2{top:46%;width:48px;animation-duration:100s;animation-delay:-40s}.c3{top:12%;width:70px;animation-duration:85s;animation-delay:-20s}.c4{top:38%;width:56px;animation-duration:60s;animation-delay:-55s}.c2,.c3,.c4{display:none}.cloudy .c2,.cloudy .c3,.cloudy .c4,.rainy .c2,.rainy .c3,.rainy .c4{display:block}.cloudy .cloud{background:#c9d0d8}
.rainy .cloud{background:#9aa5b4}
@keyframes drift{from{left:-70px}to{left:100%}}
.sill{height:14px;margin:6px -8px 0;background:var(--wood);border:3px solid var(--ink);border-radius:4px;filter:url(#sq)}
#shelf{position:relative;border:4px solid var(--ink);background:var(--back);border-radius:6px;box-shadow:0 0 0 10px var(--wood),0 0 0 13px var(--ink)}
.row{position:relative;aspect-ratio:5/1;border-bottom:14px solid var(--wood)}
.row::after{content:"";position:absolute;left:0;right:0;bottom:0;border-top:3px solid var(--ink)}
#stage{position:relative;width:100%;min-width:0}#me{display:block;width:96%;margin:4% auto 0;overflow:visible;filter:url(#sq)}
.it{position:absolute;width:18%;transform:translate(-50%,-96%);touch-action:none;user-select:none;z-index:5}
.b.armed{background:#ffe27a}
body{position:relative}#room{z-index:1}.wincol{align-self:center}
#floor{position:absolute;left:0;right:0;bottom:0;top:72%;z-index:0;background:repeating-linear-gradient(90deg,transparent 0 118px,rgba(42,34,51,.16) 118px 120px),#e0bd94;border-top:10px solid #b98f66;box-shadow:inset 0 3px 0 var(--ink)}
#drawer{display:none;flex:1 0 100%;flex-wrap:wrap;gap:8px 14px;justify-content:center;align-items:center;padding-bottom:8px;border-bottom:2px dashed rgba(42,34,51,.3)}.edit #drawer{display:flex}
.tc{display:flex;flex-direction:column;align-items:center;font-size:15px;line-height:1.1;background:#fff;border:2px solid var(--ink);border-radius:10px;padding:3px 2px;width:92px}
.row2{display:flex;align-items:center}.pick{border:0;background:none;padding:0;cursor:pointer}.pick svg{display:block;width:42px;height:42px}
.ar{border:0;background:none;font:inherit;font-size:24px;line-height:1;cursor:pointer;padding:0 3px;color:var(--ink)}.ar:hover{color:#b57b4c}.sw{display:inline-flex;gap:3px;vertical-align:middle}.dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--ink);padding:0;cursor:pointer}.dot.on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ink)}
.ty{animation:ty .35s ease-in-out infinite alternate}@keyframes ty{to{transform:translateY(2px)}}
.eat{animation:eat 2.4s ease-in-out infinite}@keyframes eat{50%{transform:translate(2px,5px)}}
.st{transform-box:fill-box;animation:zz 2.4s ease-out infinite}
.it svg,.slot svg{display:block;width:100%;height:100%;overflow:visible;filter:url(#sq)}
.it{cursor:pointer}.edit .it{cursor:grab}.edit .it:hover{outline:2px dashed rgba(42,34,51,.3)}
.edit .slot{outline:2px dashed rgba(42,34,51,.25);outline-offset:-6px}
.edit .slot:hover{background:rgba(255,255,255,.45)}
.x{position:absolute;top:2px;right:2px;display:none;width:22px;height:22px;padding:0;border-radius:50%;border:2px solid var(--ink);background:#fff;font:inherit;line-height:1;cursor:pointer}
.edit .it:hover .x{display:block}
#shaft{position:absolute;z-index:12;pointer-events:none;left:16%;top:4%;width:82%;height:84%;opacity:0;transition:opacity 1.5s;background:linear-gradient(100deg,rgba(255,236,170,.6),rgba(255,236,170,0) 75%);clip-path:polygon(0 16%,100% 0,100% 70%,0 60%)}
#dark{position:fixed;inset:0;z-index:10;pointer-events:none;background:#16143a;opacity:0;transition:opacity 1.5s}
#glows{position:fixed;inset:0;z-index:11;pointer-events:none;mix-blend-mode:screen}
.glow{position:absolute;width:300px;height:300px;margin:-150px 0 0 -150px;border-radius:50%;background:radial-gradient(circle,rgba(255,176,80,.6),rgba(255,140,50,.2) 40%,transparent 70%);animation:fl 2.2s ease-in-out infinite alternate}
@keyframes fl{from{transform:scale(.94);opacity:.8}to{transform:scale(1.05);opacity:1}}
.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fk .5s ease-in-out infinite alternate}
@keyframes fk{from{transform:scaleY(.9) rotate(-3deg)}to{transform:scaleY(1.08) rotate(3deg)}}
.tail{transform-box:view-box;transform-origin:84px 80px;animation:tw 2.6s ease-in-out infinite}
@keyframes tw{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(15deg)}}
.br{transform-box:fill-box;transform-origin:50% 100%;animation:br 4s ease-in-out infinite}
@keyframes br{50%{transform:scaleY(1.06)}}
.z{transform-box:fill-box;animation:zz 3.4s ease-in infinite}.z2{animation-delay:1.2s}
@keyframes zz{0%{opacity:0;transform:translate(0,6px)}40%{opacity:1}100%{opacity:0;transform:translate(7px,-9px)}}
.notes{display:none}.playing .notes{display:block}
.notes text{transform-box:fill-box;animation:zz 2s ease-out infinite}
#dock{position:fixed;z-index:30;left:50%;bottom:calc(12px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:max-content;max-width:96vw;display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;justify-content:center;background:rgba(244,229,211,.94);border:3px solid var(--ink);border-radius:14px;padding:8px 12px;opacity:.35;transition:opacity .3s}
#dock:hover,#dock:focus-within,.edit #dock{opacity:1}
#tray{display:none;flex:1 0 100%;flex-wrap:wrap;gap:6px;justify-content:center}.edit #tray{display:flex}
.tb{width:64px;padding:3px;font:inherit;font-size:15px;line-height:1.1;background:#fff;border:2px solid var(--ink);border-radius:10px;cursor:pointer;color:var(--ink)}
.tb svg{display:block;width:40px;height:40px;margin:0 auto}
.tb.armed{background:#ffe27a}
.b{font:inherit;color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:10px;padding:1px 10px;cursor:pointer}
.b:hover{background:#ffe27a}
.b:focus-visible,.tb:focus-visible,.x:focus-visible,input:focus-visible{outline:3px solid #5fa8d3;outline-offset:2px}
#title{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#dock input[type=range]{width:96px;accent-color:#b57b4c}
@media (max-width:720px){#room{grid-template-columns:1fr;justify-items:center}.wincol{width:150px}#shelf{width:100%}#shaft{display:none}}
@media (prefers-reduced-motion:reduce){.cloud,.glow,.fl,.tail,.br,.z,.notes text{animation:none}}
#room{grid-template-columns:118px minmax(130px,210px) minmax(0,660px);width:min(100%,1100px)}
#wallinfo{align-self:center;justify-self:end;width:108px;background:#2d3a4e;color:#9ad1ff;font-family:'Courier New',monospace;text-align:center;border:3px solid var(--ink);border-radius:8px;padding:8px 4px;box-shadow:0 0 0 5px #f0e6d6,0 0 0 8px var(--ink);position:relative;z-index:12}
#wi-t{font-size:30px;font-weight:700;line-height:1;letter-spacing:1px}#wi-ap{font-size:13px;opacity:.8}#wi-w{font-size:13px;margin-top:6px;border-top:1px dashed rgba(154,209,255,.4);padding-top:5px}
.mq.scroll{animation:mq 6s linear infinite}@keyframes mq{from{transform:translateX(var(--s))}to{transform:translateX(var(--w))}}
.pur svg{animation:pur .12s linear 10}@keyframes pur{50%{transform:translateY(-1.5px)}}
@media (max-width:1000px){#room{grid-template-columns:minmax(130px,210px) minmax(0,660px)}#wallinfo{grid-column:1;grid-row:2;justify-self:center;align-self:start;margin-top:16px}.wincol{grid-column:1;grid-row:1}#stage{grid-column:2;grid-row:1/3}}
@media (max-width:720px){#room{grid-template-columns:1fr}.wincol,#wallinfo,#stage{grid-column:1;grid-row:auto}#stage{justify-self:stretch}}
</style></head>
<body class="edit">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="sq" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence id="tb" type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="1"/><feDisplacementMap in="SourceGraphic" scale="2.5"/></filter><filter id="sq2" x="-5%" y="-10%" width="110%" height="120%"><feTurbulence id="tb2" type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="1"/><feDisplacementMap in="SourceGraphic" scale="1.6"/></filter></svg>
<div id="floor"></div>
<div id="room">
 <div id="wallinfo"><div id="wi-t">--:--</div><div id="wi-ap"></div><div id="wi-w">CLEAR</div></div><div class="wincol"><div class="win" id="win"><div class="sky" id="sky"></div><div class="stars" id="stars"></div><div class="sun" id="sun"></div><div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div><div class="cloud c4"></div><canvas id="rain"></canvas></div><div class="sill"></div></div>

</div>
<div id="dark"></div><div id="glows"></div>
<div id="dock">
 <div id="drawer">
  <div id="tray"></div>
  <span>Wall <span class="sw" id="wallc"></span></span>
  <span>You: <select class="b" id="skin" aria-label="Skin tone"></select> <select class="b" id="hs" aria-label="Hair style"><option value="short">Short hair</option><option value="long">Long hair</option><option value="bun">Bun</option></select> Hair <span class="sw" id="hc"></span> Shirt <span class="sw" id="sc"></span></span>

 <button class="b act" data-m="work">Work</button><button class="b act" data-m="nap">Nap</button><button class="b act" data-m="eat">Eat</button><button class="b act" data-m="laze">Laze</button>
 <button class="b" id="wx">Weather: clear</button>
 <label>Time <input type="range" id="hr" min="0" max="24" step="0.25"> <span id="hl"></span></label><button class="b" id="live">Live time</button>
 <button class="b" id="pp">Play</button><span id="title">Lofi radio</span><input type="range" id="vol" min="0" max="1" step="0.05" value="0.6" aria-label="Volume">
 <button class="b" id="add">Add song</button><input type="file" id="file" accept="audio/*" hidden><button class="b" id="lofi">Lofi</button>
</div>
<script>
const $=s=>document.querySelector(s),INK='#2a2233';
const PAL=['#e76f51','#f2c14e','#7fb069','#5fa8d3','#b48ead','#f4a6b7','#e8dcc2'];

flowers:c=>`<path d="M50 70Q42 44 28 24M50 70V14M50 70Q60 46 72 26" fill="none"/><circle cx="28" cy="22" r="7" fill="#e9b44c"/><circle cx="50" cy="13" r="7" fill="#d98a5f"/><circle cx="72" cy="24" r="7" fill="#cdbf9a"/><path d="M40 96h20l5-30H35z" fill="${c}"/><path d="M42 78h16"/>`,

$('#vol').oninput=e=>{vol=+e.target.value;audio.volume=vol;if(master)master.gain.value=vol};
$('#add').onclick=()=>$('#file').click();
$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;halt();P.mode='file';audio.volume=vol;audio.src=URL.createObjectURL(f);$('#title').textContent=f.name;audio.play().then(()=>setPlay(true)).catch(fail)};
$('#lofi').onclick=()=>{if(P.mode==='lofi'&&P.on){bi=(bi+1)%BEATS.length;step=Math.ceil(step/8)*8}else if(P.mode!=='lofi'){halt();P.mode='lofi'}$('#title').textContent='Lofi · '+BEATS[bi].n;if(!P.on)toggle()};
/* controls */
function syncUI(){document.body.classList.toggle('edit',S.edit);$('#edit').classList.toggle('armed',S.edit);$('#wx').textContent='Weather: '+S.wx;document.documentElement.style.setProperty('--wall',S.wall)}
$('#edit').onclick=()=>{S.edit=!S.edit;syncUI();save();renderShelf()};
const WM=['clear','cloudy','rain','auto'];
function liveWx(){if(S.wx!=='auto'||!navigator.geolocation)return;navigator.geolocation.getCurrentPosition(async p=>{try{const r=await(await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${p.coords.latitude}&longitude=${p.coords.longitude}&current=weather_code,cloud_cover,temperature_2m`)).json(),c=r.current.weather_code;liveT=r.current.temperature_2m;live=(c>=51&&c<=67)||(c>=80&&c<=99)?'rain':r.current.cloud_cover>60?'cloudy':'clear';apply()}catch(e){}},()=>{})}
$('#wx').onclick=()=>{S.wx=WM[(WM.indexOf(S.wx)+1)%4];syncUI();save();apply();rainSound(WX()==='rain');liveWx()};
/* avatar */
const WALLS=['#a9bdb6','#c9d8cf','#d8cfe6','#cfdcee','#f1d9d4','#f2e6c8','#d9e3c5','#e9d3df'],HAIRS=['#3b2a20','#8b5e3c','#d9a86c','#f0d9a0','#d98c8c','#9db4d6','#b9a3d9','#e8e2dc'],SHIRTS=['#f4a6b7','#f7c59f','#f6e08a','#b9dcae','#a8d8d8','#a9c6ee','#cbb8ea','#f0f0ec'];
function swatches(id,list,get,set){const el=$('#'+id),mark=()=>el.querySelectorAll('.dot').forEach(d=>d.classList.toggle('on',d.dataset.c===get()));el.innerHTML=list.map(c=>`<button class="dot" data-c="${c}" style="background:${c}" aria-label="${c}"></button>`).join('');el.onclick=e=>{const b=e.target.closest('.dot');if(b){set(b.dataset.c);mark()}};mark()}
swatches('wallc',WALLS,()=>S.wall,c=>{S.wall=c;save();syncUI()});
swatches('hc',HAIRS,()=>S.me.hair,c=>{S.me.hair=c;save();renderMe()});
swatches('sc',SHIRTS,()=>S.me.shirt,c=>{S.me.shirt=c;save();renderMe()});
[['Light','#fbdcc3'],['Fair','#f1c9a5'],['Tan','#d9a074'],['Brown','#a96f45'],['Deep','#6b4430']].forEach(([n,c])=>$('#skin').insertAdjacentHTML('beforeend',`<option value="${c}">${n}</option>`));
$('#skin').value=S.me.skin;$('#hs').value=S.me.style;
[['skin','skin'],['hs','style']].forEach(([id,k])=>$('#'+id).oninput=e=>{S.me[k]=e.target.value;save();renderMe()});
document.querySelectorAll('.act').forEach(b=>b.onclick=()=>{S.me.mode=b.dataset.m;save();renderMe()});
function me(){const a=S.me,m=a.mode,sk=a.skin,hr=a.hair,sh=a.shirt,
 hair=`${a.style==='long'?`<path d="M59 50Q59 28 80 28Q101 28 101 50V90Q80 97 59 90Z" fill="${hr}"/>`:`<circle cx="80" cy="50" r="20" fill="${hr}"/>`}${a.style==='bun'?`<circle cx="80" cy="26" r="9" fill="${hr}"/>`:''}<path d="M72 38Q70 52 72 64M88 38Q90 52 88 64" fill="none" stroke-width="1.5" opacity=".5"/>`,
 phones=`<path d="M60 48Q60 26 80 26Q100 26 100 48" fill="none" stroke-width="7"/><path d="M60 48Q60 26 80 26Q100 26 100 48" fill="none" stroke="#6b5f7d" stroke-width="3"/><ellipse cx="59" cy="54" rx="5" ry="8" fill="#d4c4ec"/><ellipse cx="101" cy="54" rx="5" ry="8" fill="#d4c4ec"/>`,
 head=t=>`<g transform="${t}">${a.style==='long'?'':`<rect x="73" y="62" width="14" height="16" fill="${sk}"/>`}${hair}${phones}</g>`,
 body=dy=>`<g transform="translate(0 ${dy})"><path d="M48 108Q46 80 80 78Q114 80 112 108V130H48Z" fill="${sh}"/><path d="M62 80Q80 98 98 80Q80 70 62 80Z" fill="rgba(0,0,0,.14)"/><path d="M80 92V128" fill="none" stroke-width="1.8" opacity=".5"/></g>`,
 chair='<ellipse cx="64" cy="146" rx="9" ry="5" fill="#fff"/><ellipse cx="96" cy="146" rx="9" ry="5" fill="#fff"/><rect x="56" y="134" width="14" height="12" fill="#7a8fb5"/><rect x="90" y="134" width="14" height="12" fill="#7a8fb5"/><rect x="50" y="108" width="60" height="30" rx="9" fill="#8f7bb5"/><path d="M80 138v8M54 146h52" fill="none"/><circle cx="56" cy="149" r="3" fill="#2a2233"/><circle cx="104" cy="149" r="3" fill="#2a2233"/>',
 sl=d=>`<path d="${d}" fill="none" stroke-width="13"/><path d="${d}" fill="none" stroke="${sh}" stroke-width="8"/>`,hd=(x,y)=>`<circle cx="${x}" cy="${y}" r="5" fill="${sk}"/>`;
 let A='',lap='<rect x="104" y="94" width="62" height="7" rx="2" fill="#cfd3da"/>',mug='<path d="M196 90h14v12h-14z" fill="#e76f51"/><path d="M210 93h4v6h-4" fill="none"/><path class="st" d="M203 84q-3-5 0-9" fill="none" stroke-width="2"/>';
 if(m==='work'){A=body(0)+chair+head('')+sl('M54 90Q44 102 56 112')+`<g class="ty">${sl('M104 88Q122 104 132 100')}${hd(135,99)}</g>`;lap='<rect x="100" y="98" width="70" height="4" rx="2" fill="#cfd3da"/><rect x="110" y="56" width="52" height="42" rx="3" fill="#2d3a4e"/><path d="M116 66h22M116 74h30M116 82h18M116 90h26" stroke="#9ad1ff" stroke-width="2.5"/>'}
 if(m==='nap'){A=body(20)+chair+head('translate(0 40)')+sl('M50 112Q34 108 44 98')+sl('M110 112Q126 108 116 98')+'<text class="z" x="98" y="82" font-size="18" fill="#2a2233" stroke="none">z</text><text class="z z2" x="112" y="68" font-size="13" fill="#2a2233" stroke="none">z</text>'}
 if(m==='eat'){lap='';mug='';A=body(0)+chair+head('rotate(6 80 60)')+sl('M54 90Q44 102 56 112')+`<g class="eat">${sl('M104 88Q118 96 126 96')}${hd(128,96)}<path d="M128 96L144 84M131 98L147 87" fill="none" stroke-width="2"/></g><path d="M130 92h28q-1 12-14 12t-14-12z" fill="#f2e6c9"/><path d="M136 92q3-5 6 0t6 0" fill="none" stroke="#d98a5f"/><path class="st" d="M144 84q-3-5 0-9" fill="none" stroke-width="2"/>`}
 if(m==='laze'){A=body(0)+chair+head('rotate(-6 80 60)')+sl('M52 88L34 68L64 56')+sl('M108 88L126 68L96 56')+hd(64,56)+hd(96,56)}
 const desk='<ellipse cx="70" cy="146" rx="80" ry="9" fill="#e8d3df"/><path d="M222 150h14l-2-16h-10z" fill="#c9774d"/><path d="M229 134Q222 118 218 112M229 134Q232 116 238 110M229 134V108" fill="none" stroke="#5d9a63"/><rect x="150" y="112" width="52" height="26" rx="3" fill="#a9724a"/><circle cx="176" cy="125" r="2.5" fill="#2a2233"/><rect x="170" y="92" width="26" height="8" rx="1" fill="#e9c46a"/><rect x="173" y="84" width="21" height="8" rx="1" fill="#a8d8d8"/><rect x="10" y="100" width="220" height="12" rx="3" fill="#b57b4c"/><rect x="22" y="112" width="10" height="38" fill="#9a6a46"/><rect x="208" y="112" width="10" height="38" fill="#9a6a46"/>',
 lamp='<ellipse cx="18" cy="100" rx="10" ry="3" fill="#cfd3da"/><path d="M18 100L22 72L38 62" fill="none"/><path d="M30 58l12 7-7 7z" fill="#f2c14e"/>';
 return `<g stroke="#2a2233" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">${desk}${lamp}${lap}${mug}<g transform="translate(-14 0)">${A}</g></g>`}
function renderMe(){$('#me').innerHTML=me();document.querySelectorAll('.act').forEach(b=>b.classList.toggle('armed',b.dataset.m===S.me.mode))}
/* wall panel, radio marquee, cat */
function wallUpdate(h,w){const H=Math.floor(h)%24;$('#wi-t').textContent=`${H%12||12}:${String(Math.floor((h%1)*60)).padStart(2,'0')}`;$('#wi-ap').textContent=H<12?'AM':'PM';$('#wi-w').textContent=({clear:'CLEAR',cloudy:'CLOUDY',rain:'RAIN'}[w]||'')+(S.wx==='auto'&&liveT!=null?' '+Math.round(liveT)+'°C':'')}
function setMarquee(){const t=P.on?(P.mode==='file'?$('#title').textContent:'Lofi'):'· · ·';document.querySelectorAll('.mq').forEach(el=>{const w=+el.parentNode.getAttribute('width'),len=t.length*(+el.getAttribute('font-size'))*.6;el.textContent=t;if(len>w-2){el.setAttribute('text-anchor','start');el.setAttribute('x',0);el.classList.add('scroll');el.style.setProperty('--s',w+'px');el.style.setProperty('--w',-len+'px');el.style.animationDuration=(len/14+3)+'s'}else{el.setAttribute('text-anchor','middle');el.setAttribute('x',w/2);el.classList.remove('scroll')}})}
function meow(el){ia();const t=ctx.currentTime,o=ctx.createOscillator(),f=ctx.createBiquadFilter(),a=ctx.createGain();
 if(Math.random()<.5){o.type='sawtooth';o.frequency.setValueAtTime(420,t);o.frequency.linearRampToValueAtTime(760,t+.18);o.frequency.linearRampToValueAtTime(480,t+.6);f.type='bandpass';f.Q.value=3;f.frequency.setValueAtTime(900,t);f.frequency.linearRampToValueAtTime(1800,t+.2);f.frequency.linearRampToValueAtTime(900,t+.6);a.gain.setValueAtTime(.0001,t);a.gain.linearRampToValueAtTime(.18,t+.08);a.gain.linearRampToValueAtTime(.0001,t+.65);o.connect(f);f.connect(a);a.connect(master);o.start(t);o.stop(t+.7)}
 else{o.type='sawtooth';o.frequency.value=48;f.type='lowpass';f.frequency.value=260;const l=ctx.createOscillator(),lg=ctx.createGain(),e=ctx.createGain();l.frequency.value=24;lg.gain.value=.1;a.gain.value=.1;l.connect(lg);lg.connect(a.gain);e.gain.setValueAtTime(.0001,t);e.gain.linearRampToValueAtTime(1,t+.15);e.gain.linearRampToValueAtTime(.0001,t+1.6);o.connect(f);f.connect(a);a.connect(e);e.connect(master);o.start(t);l.start(t);o.stop(t+1.7);l.stop(t+1.7)}
 if(el){el.classList.add('pur');setTimeout(()=>el.classList.remove('pur'),1400)}}
/* first-visit lofi: starts on the first click outside the control bar */
let userHalted=false;
$('#pp').addEventListener('click',()=>{if(P.on)userHalted=true},true);
const autoLofi=e=>{if(e.target.closest&&e.target.closest('#dock'))return;removeEventListener('click',autoLofi);removeEventListener('keydown',autoLofi);if(!P.on&&!userHalted)toggle()};
addEventListener('click',autoLofi);addEventListener('keydown',autoLofi);
/* squiggle boil */
let n=1;if(!matchMedia('(prefers-reduced-motion:reduce)').matches)setInterval(()=>($('#tb').setAttribute('seed',n=n%5+1),$('#tb2').setAttribute('seed',n)),160);
const placeFloor=()=>{$('#floor').style.top=(stage.getBoundingClientRect().bottom+scrollY-20)+'px'};addEventListener('resize',placeFloor);addEventListener('load',placeFloor);syncUI();renderMe();renderShelf();apply();liveWx();placeFloor();
</script></body></html>
